# Demo deployment. Populate sync:false values privately in Render.
services:
  - type: web
    name: vouch-sdn1908-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: AUTO_SEED
        value: "false"
      - key: SEED_CATALOG_ON_START
        value: "false"
      - key: USE_EMBEDDED_MONGO
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://vouch-sdn1908-web.onrender.com
      - key: WEB_APP_URL
        value: https://vouch-sdn1908-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: REDEEM_HMAC_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_SIMULATOR
        value: "false"
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        value: https://vouch-sdn1908-web.onrender.com/payment-return
      - key: VNPAY_IPN_URL
        value: https://vouch-sdn1908-api.onrender.com/api/orders/vnpay-ipn
      - key: VNPAY_VERSION
        value: 2.1.0
      - key: DEFAULT_COMMISSION_RATE
        value: "0.1"
      - key: MAIL_MODE
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: web
    name: vouch-sdn1908-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://vouch-sdn1908-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
